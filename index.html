<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskView: painel didático de tarefas desenvolvido em Vue 3 e integrado à API pública JSONPlaceholder." />
    <meta name="theme-color" content="#0c213a" />
    <!-- Define o tema antes de o Vue carregar, evitando piscar no modo claro. -->
    <script>
      (() => {
        let temaSalvo = null
        try {
          temaSalvo = localStorage.getItem('taskview-tema')
        } catch (_) {
          // A aplicação continua mesmo se o navegador bloquear o armazenamento.
        }
        const prefereEscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const temaInicial = temaSalvo === 'light' || temaSalvo === 'dark'
          ? temaSalvo
          : prefereEscuro ? 'dark' : 'light'
        document.documentElement.dataset.theme = temaInicial
      })()
    </script>
    <title>TaskView | Painel de Tarefas</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
